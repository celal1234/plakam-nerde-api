name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env: { POSTGRES_DB: plakam, POSTGRES_USER: plakam, POSTGRES_PASSWORD: plakam }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U plakam" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      # S3 uyumlu sahte depolama; e2e testleri imzalı adreslerle gerçekten yükleme yapar.
      s3:
        image: motoserver/moto:5.2.3
        ports: ["3900:5000"]
    env:
      DATABASE_URL: postgres://plakam:plakam@localhost:5432/plakam
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-1234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high

  # Coolify'ın kuracağı imajın derlendiğini ve ayağa kalktığını doğrular.
  docker:
    runs-on: ubuntu-latest
    # docker-compose.yml JWT_SECRET'ı zorunlu tutar; derleme adımı da dosyayı okuduğu için iş düzeyinde verilir.
    env:
      JWT_SECRET: ci-docker-secret-ci-docker-secret-1234
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api
      - run: docker compose up -d --wait
      - run: curl -fsS localhost:3000/api/v1/health
      - if: failure()
        run: docker compose logs api
